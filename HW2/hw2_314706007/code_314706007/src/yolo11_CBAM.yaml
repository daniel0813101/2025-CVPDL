# YOLO11m variant augmented with standalone CBAM attention layers.
# Model docs: https://docs.ultralytics.com/models/yolo11

# Parameters
nc: 80  # number of classes
scales:  # model compound scaling constants, i.e. 'model=yolo11m_CBAM.yaml' will call yolo11m_CBAM.yaml with scale 'm'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11m backbone with CBAM layers applied after each C3k2 block
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, CBAMLayer, [256]]
  - [-1, 1, Conv, [256, 3, 2]]  # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, CBAMLayer, [512]]
  - [-1, 1, Conv, [512, 3, 2]]  # 7-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, CBAMLayer, [512]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 10-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, CBAMLayer, [1024]]
  - [-1, 1, SPPF, [1024, 5]]  # 13
  - [-1, 2, C2PSA, [1024]]  # 14

# YOLO11m head with CBAM layers applied after each C3k2 block
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, CBAMLayer, [512]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256, False]]  # (P3/8-small)
  - [-1, 1, CBAMLayer, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [512, False]]  # (P4/16-medium)
  - [-1, 1, CBAMLayer, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2, [1024, True]]  # (P5/32-large)
  - [-1, 1, CBAMLayer, [1024]]

  - [[22, 26, 30], 1, Detect, [nc]]  # Detect(P3, P4, P5)

